version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      mcp-sdk:
        patterns: ['@modelcontextprotocol/*']
      dev-tooling:
        dependency-type: development
    ignore:
      # typescript-eslint doesn't support TS 7 yet; revisit when it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types must match the oldest supported runtime (engines: Node 22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
