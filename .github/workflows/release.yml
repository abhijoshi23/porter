name: Release

# Changesets flow: merging changesets to main opens a "Version Packages" PR; merging that
# PR publishes to npm with provenance (a signed attestation linking each tarball to this
# workflow run and commit).
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # v2 takes the token as an input, renames publish to publish-script, and npm auth comes from setup-node's registry-url
      # plus NODE_AUTH_TOKEN (v2 no longer writes .npmrc from NPM_TOKEN).
      - uses: changesets/action@v2
        with:
          publish-script: pnpm release
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
